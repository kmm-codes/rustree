[package]
name = "rustree"
version = "0.1.0"
edition = "2021"
description = "Fast NTFS disk space analyzer with GUI"
authors = ["Kevin"]

# Das Binary bekommt per build.rs das Admin-Manifest - auch sein Test-Harness,
# das sich dann ohne Elevation nicht starten ließe. Alle Tests liegen in der
# Library und unter tests/, also braucht das Binary kein eigenes.
[[bin]]
name = "rustree"
path = "src/main.rs"
test = false

[dependencies]
# GUI - Skia statt FemtoVG: sauberere Textdarstellung (Hinting, Subpixel-
# Positionierung) unter Windows. Qt-Backend und Software-Renderer entfallen.
slint = { version = "1.9", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-skia",
] }

# Allokator: Millionen kleiner Strings (Dateinamen) aus vielen Threads -
# der Windows-Heap skaliert dabei schlecht, mimalloc gut
mimalloc = { version = "0.1", default-features = false }

# NTFS MFT access
ntfs = "0.4"
windows = { version = "0.58", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Foundation",
    "Win32_System_Ioctl",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
]}

# Nativer Ordner-Dialog (IFileDialog) für "Ordner wählen"
rfd = "0.15"

# CLI parsing
clap = { version = "4", features = ["derive"] }

# Utilities
byteorder = "1.5"
rayon = "1.10"
humansize = "2"
thiserror = "2"

[dev-dependencies]
# Für async tests falls nötig
tokio = { version = "1", features = ["rt", "macros"] }

[build-dependencies]
slint-build = "1.9"
embed-resource = "2"

[profile.release]
opt-level = 3
lto = true
