[package]
name = "rustree"
version = "0.1.0"
edition = "2021"
description = "Fast NTFS disk space analyzer with GUI"
authors = ["Kevin"]

# Das Binary bekommt per build.rs das Admin-Manifest - auch sein Test-Harness,
# das sich dann ohne Elevation nicht starten ließe. Alle Tests liegen in der
# Library und unter tests/, also braucht das Binary kein eigenes.
[[bin]]
name = "rustree"
path = "src/main.rs"
test = false

[dependencies]
# GUI
slint = "1.9"

# NTFS MFT access
ntfs = "0.4"
windows = { version = "0.58", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Foundation",
    "Win32_System_Ioctl",
    "Win32_Security",
    "Win32_System_Console"
]}

# CLI parsing
clap = { version = "4", features = ["derive"] }

# Utilities
byteorder = "1.5"
rayon = "1.10"
humansize = "2"
thiserror = "2"

[dev-dependencies]
# Für async tests falls nötig
tokio = { version = "1", features = ["rt", "macros"] }

[build-dependencies]
slint-build = "1.9"
embed-resource = "2"

[profile.release]
opt-level = 3
lto = true
